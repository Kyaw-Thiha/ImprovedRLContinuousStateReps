[project]
name = "mjlab-centering"
version = "0.1.0"
description = "Reward centering and SSP input encoders for PPO on continuing mjlab robotics tasks"
requires-python = ">=3.12,<3.14"
dependencies = [
  # Pinned to the same commit the local venv and the tests were validated against. PyPI's mjlab 1.6.0 pins
  # rsl-rl-lib==5.4.2, while this commit pins 5.5.1; the algorithm hooks were read from 5.5.1.
  "mjlab @ git+https://github.com/mujocolab/mjlab@8bb2bc9e187797689ec82c78c35019afd2fd0376",
  # The SSP/RFF observation arms build a HexSSP phase matrix (obs.install_encoder builds a reference width even for the
  # rff arm), and ssp_torch imports sspspace for that matrix. Without it every encoder job dies at env construction while
  # raw jobs run - which is exactly what happened on 2026-11-06 when all 30 width/sweep jobs failed on a healthy host.
  "sspspace @ git+https://github.com/ctn-waterloo/sspspace@f3f68570e9488d32ce3e5dfaca6de5b0ccf5e91b",
  "boto3>=1.34",
  "numpy",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

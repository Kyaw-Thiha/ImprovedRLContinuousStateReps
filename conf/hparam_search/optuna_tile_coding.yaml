defaults:
  - override /representation: tile_coding

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
    direction: maximize
    n_trials: 100
    params:
      representation.eps:
        type: float
        low: 0.1
        high: 0.8
      representation.lr:
        type: float
        low: 0.001
        high: 0.5
        log: true
      representation.num_tilings:
        type: int
        low: 4
        high: 32
